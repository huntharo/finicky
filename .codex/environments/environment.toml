# Shared worktree setup and actions for PwrAgent/Codex.
version = 1
name = "PwrFinicky"

# Go 1.24+ and Xcode Command Line Tools (macOS) must be installed on the host.
[setup]
script = '''
set -e
unset PREFIX
if ! command -v nvm >/dev/null 2>&1; then
  export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
  if [ ! -s "$NVM_DIR/nvm.sh" ]; then
    printf 'Install nvm before using the PwrFinicky environment.\n' >&2
    exit 1
  fi
  . "$NVM_DIR/nvm.sh"
fi
nvm install
node apps/pwrfinicky/scripts/worktree.mjs setup
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"
$nodeVersion = (Get-Content -LiteralPath .nvmrc -Raw -ErrorAction Stop).Trim().TrimStart('v')
nvm install $nodeVersion
if ($LASTEXITCODE -ne 0) { throw "nvm install failed" }
nvm use $nodeVersion
if ($LASTEXITCODE -ne 0) { throw "nvm use failed" }
node apps/pwrfinicky/scripts/worktree.mjs setup
if ($LASTEXITCODE -ne 0) { throw "PwrFinicky setup failed" }
'''

[cleanup]
script = "rm -rf apps/pwrfinicky/node_modules packages/config-api/node_modules"

[cleanup.win32]
script = '''
$ErrorActionPreference = "Stop"
foreach ($directory in @("apps/pwrfinicky/node_modules", "packages/config-api/node_modules")) {
  if (Test-Path -LiteralPath $directory) {
    Remove-Item -LiteralPath $directory -Recurse -Force
  }
}
'''

# Match PwrAgent's explicit platform scoping: one button per name on each OS.

[[actions]]
name = "Start"
icon = "run"
platform = "darwin"
command = '''
set -e
unset PREFIX
if ! command -v nvm >/dev/null 2>&1; then
  export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
  if [ ! -s "$NVM_DIR/nvm.sh" ]; then
    printf 'Install nvm before using the PwrFinicky environment.\n' >&2
    exit 1
  fi
  . "$NVM_DIR/nvm.sh"
fi
nvm use --silent
node apps/pwrfinicky/scripts/worktree.mjs start
'''

