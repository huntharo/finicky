[[actions]]
name = "Start"
icon = "run"
platform = "win32"
command = '''
powershell.exe -NoProfile -Command {
  $ErrorActionPreference = "Stop"
  $nodeVersion = (Get-Content -LiteralPath .nvmrc -Raw -ErrorAction Stop).Trim().TrimStart('v')
  nvm use $nodeVersion
  if ($LASTEXITCODE -ne 0) { throw "nvm use failed; run environment setup first" }
  node apps/pwrfinicky/scripts/worktree.mjs start
  exit $LASTEXITCODE
}
'''

